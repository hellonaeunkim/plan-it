plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.frend'
version = '0.0.3-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.1.8") // Spring AI version
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'software.amazon.awssdk:s3:2.25.24'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'
    implementation 'com.aventrix.jnanoid:jnanoid:2.0.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

    // Mailing
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Querydsl
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Spring AI
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    test {
        useJUnitPlatform {
            excludeTags 'external-ai'
        }
    }

    // 비동기 코드 테스트 라이브러리
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

// Querydsl 빌드 옵션 (옵셔널)
def generated = 'src/main/generated'

// querydsl QClass 파일 생성 위치를 지정
tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(generated))
}

// java source set 에 querydsl QClass 위치 추가
sourceSets {
    main.java.srcDirs += [generated]
}

// gradle clean 시에 QClass 디렉토리 삭제
clean {
    delete file(generated)
}

// 실제 Groq API를 한 번 호출하는 스모크 테스트 전용 작업 (실제 비용 발생)
// 기본 test 작업에서는 제외되며, 명시적으로만 실행한다: ./gradlew groqEvaluationTest
tasks.register('groqEvaluationTest', Test) {
    group = 'verification'
    description = '실제 Groq API를 한 번 호출하는 스모크 테스트만 실행합니다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai-smoke'
    }

    // 캐시된 이전 성공 결과로 실제 호출 없이 넘어가지 않도록 매번 재실행
    outputs.upToDateWhen { false }
}

// 실제 서비스 흐름으로 고정 평가셋 12건을 순차 실행하는 기준선 측정 작업 (실제 비용 발생)
tasks.register('groqBaselineEvaluation', Test) {
    group = 'verification'
    description = '실제 Groq API와 AIChatMessageService를 사용해 기준선 평가 12건을 실행합니다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai-baseline'
    }

    testLogging {
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

// 프롬프트 역할 경계 변경의 입력 토큰 고정 비용을 독립 질문 1건으로 측정 (실제 비용 발생)
tasks.register('groqPromptBoundaryEvaluation', Test) {
    group = 'verification'
    description = '실제 Groq API와 AIChatMessageService를 사용해 프롬프트 경계 변경 질문 1건을 실행합니다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai-prompt-boundary'
    }

    testLogging {
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

// 부족한 정보와 관련 일정을 함께 안내하는 v5 응답 규칙으로 고정 평가셋 12건을 재측정 (실제 비용 발생)
tasks.register('groqResponsePolicyEvaluation', Test) {
    group = 'verification'
    description = '실제 Groq API와 AIChatMessageService를 사용해 ai-chat-v5 응답 규칙을 평가합니다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai-response-policy'
    }

    testLogging {
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

// 과거 일정 제외와 일정 개수 상한을 적용한 v6 컨텍스트로 고정 평가셋 12건을 재측정 (실제 비용 발생)
tasks.register('groqScheduleScopeEvaluation', Test) {
    group = 'verification'
    description = '실제 Groq API와 AIChatMessageService를 사용해 ai-chat-v6 일정 범위 제한을 평가합니다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai-schedule-scope'
    }

    testLogging {
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

// querydsl 수동 빌드 task 정의
tasks.register("compileQuerydsl", JavaCompile) {
    group = "build"
    description = "Generates the QueryDSL Q-types"

    source = sourceSets.main.java
    classpath = configurations.compileClasspath + configurations.annotationProcessor
    destinationDirectory = file(generated)
    options.getGeneratedSourceOutputDirectory().set(file(generated))
}
