spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false

  ai:
    openai:
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b

logging:
  level:
    root: WARN
    com.frend.planit.domain.chatbot.chatMessage.service.AIChatMessageService: INFO
